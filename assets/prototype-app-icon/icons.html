<!doctype html>
<!--
  PROTOTYPE, throwaway. Branch prototype/app-icon, for the "App icon" ticket
  (Map: Scaffold v2). Four concepts for Scaffold's app icon, switchable via
  ?variant= (all, A, B, C, D) and the floating bar at the bottom.
  Double-click to open. Each concept has a full drawing (32 px and up) and a
  hand-fitted small drawing (16 and 24 px), as a multi-size .ico would.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scaffold icon prototype</title>
<style>
  :root {
    --desk: #e9e6df;
    --sheet: #fffefb;
    --line: #d8d4cb;
    --muted: #6f6a60;
    --accent: #2e6b4e;
    --dark-desk: #151517;
    --dark-sheet: #252528;
    font-family: system-ui, 'Segoe UI', sans-serif;
    color: #222;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); padding: 24px 16px 96px; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  p.blurb { margin: 0 0 8px; max-width: 70ch; line-height: 1.45; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel { flex: 1 1 320px; border-radius: 12px; padding: 20px; background: var(--sheet); }
  .panel.dark { background: var(--dark-desk); color: #e8e6e1; }
  .panel .cap { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .panel.dark .cap { color: #999; }
  .hero { display: grid; place-items: center; }
  .hero svg { width: 256px; height: 256px; }
  .ladder { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .ladder figure { margin: 0; text-align: center; font-size: 11px; color: inherit; }
  .ladder figure img { display: block; margin: 0 auto 6px; }
  .pixel { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .pixel figure { margin: 0; font-size: 11px; text-align: center; }
  .pixel canvas { image-rendering: pixelated; display: block; margin-bottom: 6px; border-radius: 4px; }

  /* Windows 11-ish taskbar */
  .taskbar { height: 48px; display: flex; justify-content: center; align-items: center; gap: 4px; border-radius: 8px; }
  .taskbar.light { background: #eeeeee; }
  .taskbar.dark { background: #1c1c1c; }
  .tb-btn { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; position: relative; }
  .tb-btn.active::after { content: ''; position: absolute; bottom: 2px; width: 16px; height: 3px; border-radius: 2px; background: #888; }
  .taskbar.light .tb-btn.active { background: rgb(0 0 0 / 5%); }
  .taskbar.dark .tb-btn.active { background: rgb(255 255 255 / 8%); }
  .ph { width: 24px; height: 24px; border-radius: 5px; }

  /* window title bar */
  .titlebar { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; border-radius: 8px 8px 0 0; }
  .titlebar.light { background: #e9e6df; color: #222; }
  .titlebar.dark { background: #151517; color: #e8e6e1; }
  .titlebar .controls { margin-left: auto; letter-spacing: 18px; opacity: .6; }

  /* macOS-ish dock */
  .wall { border-radius: 12px; padding: 40px 16px 10px; display: flex; justify-content: center; }
  .wall.light { background: linear-gradient(160deg, #c9d6e3, #e7d9c8); }
  .wall.dark { background: linear-gradient(160deg, #1d2633, #2b2420); }
  .dock { display: flex; gap: 10px; padding: 8px 12px; border-radius: 20px; align-items: flex-end; }
  .wall.light .dock { background: rgb(255 255 255 / 45%); }
  .wall.dark .dock { background: rgb(40 40 40 / 60%); }
  .dock .ph { width: 56px; height: 56px; border-radius: 13px; }

  /* comparison table */
  table.compare { border-collapse: separate; border-spacing: 0; width: 100%; background: var(--sheet); border-radius: 12px; overflow: hidden; }
  table.compare td, table.compare th { padding: 12px 10px; text-align: center; vertical-align: middle; font-size: 12px; }
  table.compare th { color: var(--muted); font-weight: 600; }
  table.compare td.name { text-align: left; font-size: 13px; }
  table.compare td.name b { display: block; font-size: 15px; }
  table.compare td.dk { background: var(--dark-desk); }
  table.compare tr + tr td { border-top: 1px solid var(--line); }
  table.compare td.dk { border-top-color: #2c2c30 !important; }
  .scroll { overflow-x: auto; }

  /* switcher, not part of the design */
  .switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #111; color: #fff; padding: 6px; border-radius: 999px; box-shadow: 0 6px 24px rgb(0 0 0 / 35%); font-size: 13px; z-index: 10; }
  .switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 32px; height: 32px; cursor: pointer; font-size: 15px; }
  .switcher button:hover { background: #555; }
  .switcher span { min-width: 220px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>
<div class="switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
</div>
<script>
const G = '#2e6b4e';      // look B accent (light)
const GL = '#79c29e';     // look B accent (dark)
const GD = '#1d4a35';     // couplers
const C = '#fffefb';      // sheet
const RULE = '#c9c3b6';
const INK = '#a39d90';

const svg = (vb, body) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vb} ${vb}">${body}</svg>`;
const dots = (pts, r, fill) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');

const CONCEPTS = {
  A: {
    name: 'Braced tower',
    blurb: 'A scaffold bay seen head-on: two standards, three ledgers poking out like putlogs, cross-bracing, and coupler dots at the joints. Cream on the green accent tile. The most literal "scaffold".',
    full: svg(512, `
      <rect x="32" y="32" width="448" height="448" rx="104" fill="${G}"/>
      <g stroke="${C}" stroke-width="34" stroke-linecap="round" fill="none">
        <path d="M176 104V408M336 104V408"/>
        <path d="M120 128H392M120 256H392M120 384H392"/>
        <path d="M176 128L336 256M336 128L176 256M176 384L336 256"/>
      </g>
      ${dots([[176,128],[336,128],[176,256],[336,256],[176,384],[336,384]], 13, GD)}`),
    small: svg(16, `
      <rect width="16" height="16" rx="3.5" fill="${G}"/>
      <g fill="${C}">
        <rect x="4" y="2" width="2" height="12"/><rect x="10" y="2" width="2" height="12"/>
        <rect x="2" y="3" width="12" height="2"/><rect x="2" y="11" width="12" height="2"/>
      </g>
      <path d="M6 11L10 5" stroke="${C}" stroke-width="1.6"/>`),
  },
  B: {
    name: 'Page in scaffolding',
    blurb: 'A manuscript page under construction: the top half written, the bottom still blank, with green scaffolding standing in front of it. No tile; the page is the shape. Ties to the "paper on a desk" look.',
    full: svg(512, `
      <rect x="120" y="56" width="272" height="400" rx="18" fill="${C}" stroke="${RULE}" stroke-width="8"/>
      <g stroke="${INK}" stroke-width="14" stroke-linecap="round">
        <path d="M168 116H344M168 158H316M168 200H336M168 242H280"/>
      </g>
      <g stroke="${G}" stroke-width="30" stroke-linecap="round" fill="none">
        <path d="M88 40V472M424 40V472"/>
        <path d="M56 296H456M56 432H456"/>
        <path d="M88 432L424 296"/>
      </g>
      ${dots([[88,296],[424,296],[88,432],[424,432]], 12, GD)}`),
    small: svg(16, `
      <rect x="3.5" y="1.5" width="9" height="13" rx="1" fill="${C}" stroke="${RULE}"/>
      <g fill="${INK}"><rect x="5" y="3" width="6" height="1"/><rect x="5" y="5" width="4" height="1"/></g>
      <g fill="${G}">
        <rect x="1" y="1" width="2" height="15"/><rect x="13" y="1" width="2" height="15"/>
        <rect x="0" y="8" width="16" height="2"/><rect x="0" y="13" width="16" height="2"/>
      </g>`),
  },
  C: {
    name: 'Tube S',
    blurb: 'The S of Scaffold bent from scaffold tube, with coupler bolts at each corner. A monogram first, a scaffold second; the simplest shape at 16 px.',
    full: svg(512, `
      <rect x="32" y="32" width="448" height="448" rx="104" fill="${G}"/>
      <path d="M368 120H160V256H352V392H144" stroke="${C}" stroke-width="60" fill="none" stroke-linejoin="round"/>
      ${dots([[160,120],[160,256],[352,256],[352,392]], 20, GD)}`),
    small: svg(16, `
      <rect width="16" height="16" rx="3.5" fill="${G}"/>
      <path d="M12 4H5V8H11V12H4" stroke="${C}" stroke-width="2" fill="none"/>`),
  },
  D: {
    name: 'Rising storeys',
    blurb: 'Scaffolding stepping up storey by storey, with one brace climbing the whole way: the story built a level at a time. Light green on a charcoal tile, using the dark-mode accent.',
    full: svg(512, `
      <rect x="32" y="32" width="448" height="448" rx="104" fill="#232326"/>
      <g stroke="${GL}" stroke-width="26" stroke-linecap="round" fill="none">
        <path d="M96 408H416"/>
        <path d="M128 408V312M224 408V216M320 408V120M400 408V120"/>
        <path d="M128 312H400M224 216H400M320 120H400"/>
        <path d="M128 408L224 312L320 216L400 120" stroke-width="18" opacity=".8"/>
      </g>
      ${dots([[128,312],[224,312],[224,216],[320,216],[320,312],[320,120],[400,120],[400,216],[400,312]], 10, '#2f5e47')}`),
    small: svg(16, `
      <rect width="16" height="16" rx="3.5" fill="#232326"/>
      <g fill="${GL}">
        <rect x="2" y="12" width="12" height="2"/>
        <rect x="3" y="9" width="1.5" height="3"/><rect x="3" y="9" width="10" height="1.5"/>
        <rect x="7" y="6" width="1.5" height="6"/><rect x="7" y="6" width="6" height="1.5"/>
        <rect x="11.5" y="3" width="1.5" height="9"/><rect x="10" y="3" width="3" height="1.5"/>
      </g>`),
  },
};

const url = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const art = (c, size) => (size <= 24 ? c.small : c.full);
const img = (c, size) => `<img src="${url(art(c, size))}" width="${size}" height="${size}" alt="">`;

const PH_LIGHT = ['#8aa4c8', '#d9a066', '#9a8fbf', '#7fb0a8'];
const placeholders = (n, cls = '') => PH_LIGHT.slice(0, n).map(c => `<div class="ph ${cls}" style="background:${c}"></div>`);

function taskbar(c, theme) {
  const ph = placeholders(4).map(p => `<div class="tb-btn">${p}</div>`);
  ph.splice(2, 0, `<div class="tb-btn active">${img(c, 24)}</div>`);
  return `<div class="taskbar ${theme}">${ph.join('')}</div>`;
}
function titlebar(c, theme) {
  return `<div class="titlebar ${theme}">${img(c, 16)}<span>The Lantern Keeper — Scaffold</span><span class="controls">–▢✕</span></div>`;
}
function dock(c, theme) {
  const ph = placeholders(4);
  ph.splice(2, 0, img(c, 56));
  return `<div class="wall ${theme}"><div class="dock">${ph.join('')}</div></div>`;
}
function ladder(c) {
  return [16, 24, 32, 48, 64, 128, 256].map(s =>
    `<figure>${img(c, s)}${s}${s <= 24 ? ' · small' : ''}</figure>`).join('');
}
function pixelFigures(key) {
  return [16, 24, 32, 48].map(s =>
    `<figure><canvas data-key="${key}" data-size="${s}" width="${s}" height="${s}" style="width:${s * (s <= 24 ? 6 : 3)}px;height:${s * (s <= 24 ? 6 : 3)}px"></canvas>${s} px, zoomed</figure>`).join('');
}

function renderOne(key) {
  const c = CONCEPTS[key];
  return `
    <h1>${key}. ${c.name}</h1>
    <p class="blurb">${c.blurb}</p>
    <h2>512 px</h2>
    <div class="row">
      <div class="panel hero">${c.full}</div>
      <div class="panel dark hero">${c.full}</div>
    </div>
    <h2>Sizes (16 and 24 use the small drawing)</h2>
    <div class="row">
      <div class="panel"><div class="ladder">${ladder(c)}</div></div>
      <div class="panel dark"><div class="ladder">${ladder(c)}</div></div>
    </div>
    <h2>Pixel-true at small sizes (rasterised, then zoomed)</h2>
    <div class="row">
      <div class="panel"><div class="pixel">${pixelFigures(key)}</div></div>
      <div class="panel dark"><div class="pixel">${pixelFigures(key)}</div></div>
    </div>
    <h2>Windows taskbar (24 px) and title bar (16 px)</h2>
    <div class="row">
      <div class="panel">${taskbar(c, 'light')}<div style="height:16px"></div>${titlebar(c, 'light')}</div>
      <div class="panel dark">${taskbar(c, 'dark')}<div style="height:16px"></div>${titlebar(c, 'dark')}</div>
    </div>
    <h2>macOS dock</h2>
    <div class="row">
      <div class="panel" style="padding:0">${dock(c, 'light')}</div>
      <div class="panel" style="padding:0">${dock(c, 'dark')}</div>
    </div>`;
}

function renderAll() {
  const sizes = [128, 48, 32, 24, 16];
  const rows = Object.entries(CONCEPTS).map(([k, c]) => `
    <tr>
      <td class="name"><b>${k}. ${c.name}</b></td>
      ${sizes.map(s => `<td>${img(c, s)}</td>`).join('')}
      ${sizes.map(s => `<td class="dk">${img(c, s)}</td>`).join('')}
    </tr>`).join('');
  const strips = theme => {
    const icons = Object.values(CONCEPTS).map(c => `<div class="tb-btn">${img(c, 24)}</div>`);
    return `<div class="taskbar ${theme}">${placeholders(2).map(p => `<div class="tb-btn">${p}</div>`).join('')}${icons.join('')}${placeholders(2).slice(0).map(p => `<div class="tb-btn">${p}</div>`).join('')}</div>`;
  };
  return `
    <h1>Scaffold app icon: four concepts</h1>
    <p class="blurb">Side by side at the sizes that matter, on light and dark. Use ← / → (or the bar below) to open one concept in detail. Feedback like "the tile from C with the bracing from A" is what this is for.</p>
    <h2>All sizes</h2>
    <div class="scroll"><table class="compare">
      <tr><th></th>${sizes.map(s => `<th>${s}</th>`).join('')}${sizes.map(s => `<th class="dk" style="background:var(--dark-desk);color:#999">${s}</th>`).join('')}</tr>
      ${rows}
    </table></div>
    <h2>In a taskbar, all four (A B C D, between placeholder apps)</h2>
    <div class="row">
      <div class="panel">${strips('light')}</div>
      <div class="panel dark">${strips('dark')}</div>
    </div>`;
}

const VARIANTS = ['all', 'A', 'B', 'C', 'D'];
function current() {
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS.includes(v) ? v : 'all';
}
function render() {
  const v = current();
  document.getElementById('app').innerHTML = v === 'all' ? renderAll() : renderOne(v);
  document.getElementById('label').textContent =
    v === 'all' ? 'All (comparison)' : `${v} (${CONCEPTS[v].name})`;
  document.querySelectorAll('canvas[data-key]').forEach(cv => {
    const s = +cv.dataset.size;
    const im = new Image();
    im.onload = () => cv.getContext('2d').drawImage(im, 0, 0, s, s);
    im.src = url(art(CONCEPTS[cv.dataset.key], s));
  });
}
function go(step) {
  const i = (VARIANTS.indexOf(current()) + step + VARIANTS.length) % VARIANTS.length;
  const p = new URLSearchParams(location.search);
  p.set('variant', VARIANTS[i]);
  history.replaceState(null, '', '?' + p);
  render();
  scrollTo(0, 0);
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
render();
</script>
</body>
</html>
